<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AngoMovie | Canais de TV Ao Vivo HD</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

    <style>
        :root {
            --fundo-principal: #050a18;
            --fundo-secundario: #0a101f;
            --fundo-cartao: #141826;
            --destaque-principal: #e50914;
            --texto-principal: #ffffff;
            --texto-suave: #b3b3b3;
            --fonte-principal: "Montserrat", sans-serif;
            --borda: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--fundo-principal);
            color: var(--texto-principal);
            font-family: var(--fonte-principal);
            margin: 0;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar Fixa Estilo Premium */
        .sidebar {
            width: 260px;
            background: var(--fundo-secundario);
            height: 100vh;
            position: fixed;
            left: 0; top: 0;
            border-right: 1px solid var(--borda);
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .sidebar-header {
            padding: 35px 20px;
            text-align: center;
            border-bottom: 1px solid var(--borda);
        }

        .logo {
            color: var(--destaque-principal);
            font-weight: 900;
            font-size: 26px;
            text-decoration: none;
            letter-spacing: -1px;
        }

        .categories-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px 0;
        }

        .cat-link {
            display: block;
            padding: 14px 25px;
            color: var(--texto-suave);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s ease;
            cursor: pointer;
            border-left: 4px solid transparent;
            text-transform: uppercase;
        }

        .cat-link:hover, .cat-link.active {
            background: rgba(229, 9, 20, 0.12);
            color: white;
            border-left-color: var(--destaque-principal);
        }

        /* Área de Conteúdo */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 40px;
        }

        header {
            margin-bottom: 45px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid var(--borda);
            padding-bottom: 20px;
        }

        h2 { font-size: 28px; font-weight: 700; margin: 0; text-transform: uppercase; }

        /* Grid de Canais */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--fundo-cartao);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 1px solid transparent;
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--destaque-principal);
            box-shadow: 0 12px 40px rgba(229, 9, 20, 0.45);
        }

        .card img {
            width: 100%;
            height: 95px;
            object-fit: contain;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #000;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
        }

        .card p {
            font-size: 12px;
            font-weight: 700;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-transform: uppercase;
            color: var(--texto-principal);
        }

        .status-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 100px 20px;
            color: var(--texto-suave);
            font-size: 16px;
        }

        /* Estilização da Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--fundo-principal); }
        ::-webkit-scrollbar-thumb { background: var(--destaque-principal); border-radius: 10px; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; padding: 25px; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="/" class="logo">ANGOMOVIE</a>
        </div>
        <div class="categories-container" id="categories-list">
            <div class="cat-link active" id="btn-home" onclick="resetGrid()">🏠 TODOS OS CANAIS</div>
            <!-- Categorias injetadas via JavaScript -->
        </div>
    </aside>

    <main class="main-content">
        <header>
            <div>
                <h2 id="cat-title">Canais de TV</h2>
                <p style="font-size: 11px; color: var(--texto-suave); margin-top: 5px;">SINAL HD EM TEMPO REAL</p>
            </div>
            <div style="font-size: 10px; opacity: 0.3; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;">Streaming Gratuito</div>
        </header>

        <div class="grid" id="channels-grid">
            <div class="status-msg">Conectando ao sistema AngoMovie...</div>
        </div>
    </main>

<script>
    // URL DO SEU CLOUDFLARE WORKER
    const WORKER_URL = "https://api-angomovie.lucreciapaulo93.workers.dev";

    // Função para carregar categorias com proteção de cache
    async function loadCategories() {
        try {
            // O parâmetro _t força o navegador a ignorar qualquer cache de erro de CORS anterior
            const response = await fetch(`${WORKER_URL}/?action=get_live_categories&_t=${Date.now()}`, {
                mode: 'cors'
            });
            const data = await response.json();
            
            if (!Array.isArray(data)) return;

            const list = document.getElementById('categories-list');
            data.forEach(cat => {
                const div = document.createElement('div');
                div.className = 'cat-link';
                div.innerText = cat.category_name; 
                div.onclick = () => {
                    document.querySelectorAll('.cat-link').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    document.getElementById('cat-title').innerText = cat.category_name;
                    loadChannels(cat.category_id);
                };
                list.appendChild(div);
            });
        } catch (e) {
            console.error("Erro ao carregar categorias:", e);
        }
    }

    // Função para carregar canais com proteção de cache
    async function loadChannels(catId = '') {
        const grid = document.getElementById('channels-grid');
        grid.innerHTML = '<div class="status-msg">Sintonizando canais, aguarde...</div>';
        
        try {
            const url = `${WORKER_URL}/?action=get_live_streams${catId ? '&category_id='+catId : ''}&_t=${Date.now()}`;
            const response = await fetch(url, {
                mode: 'cors'
            });
            const data = await response.json();
            
            if (!Array.isArray(data)) {
                grid.innerHTML = '<div class="status-msg">❌ O servidor IPTV não respondeu corretamente.</div>';
                return;
            }

            grid.innerHTML = '';
            if (data.length === 0) {
                grid.innerHTML = '<div class="status-msg">Nenhum canal disponível nesta categoria.</div>';
                return;
            }

            // Exibimos até 200 canais para garantir performance
            data.slice(0, 200).forEach(ch => {
                const thumb = ch.stream_icon ? ch.stream_icon : 'https://via.placeholder.com/150x90/141826/ffffff?text=TV';
                grid.innerHTML += `
                    <div class="card" onclick="location.href='player.html?id=${ch.stream_id}&name=${encodeURIComponent(ch.name)}'">
                        <img src="${thumb}" onerror="this.src='https://via.placeholder.com/150x90/141826/ffffff?text=TV'" loading="lazy">
                        <p title="${ch.name}">${ch.name}</p>
                    </div>`;
            });
        } catch (e) {
            grid.innerHTML = '<div class="status-msg">❌ Falha de conexão. Tente atualizar a página (F5).</div>';
            console.error(e);
        }
    }

    // Função para voltar ao estado inicial
    function resetGrid() {
        document.querySelectorAll('.cat-link').forEach(el => el.classList.remove('active'));
        document.getElementById('btn-home').classList.add('active');
        document.getElementById('cat-title').innerText = "Todos os Canais";
        loadChannels('');
    }

    // Inicialização ao carregar a página
    window.onload = () => {
        loadCategories();
        loadChannels();
    };
</script>
</body>
</html>
