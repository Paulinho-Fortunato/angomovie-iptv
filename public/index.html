<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <title>AngoMovie | TV Ao Vivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet" />
    <style>
        :root {
            --fundo-principal: #050a18;
            --fundo-secundario: #0a101f;
            --fundo-cartao: #141826;
            --destaque-principal: #e50914;
            --texto-principal: #ffffff;
            --texto-suave: #b3b3b3;
        }
        body { 
            background: var(--fundo-principal); 
            color: var(--texto-principal); 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; display: flex; 
        }
        .sidebar { 
            width: 260px; background: var(--fundo-secundario); height: 100vh; 
            position: fixed; overflow-y: auto; border-right: 1px solid #1f2937; 
        }
        .main { margin-left: 260px; flex: 1; padding: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px; }
        .cat-link { 
            display: block; padding: 12px 20px; color: var(--texto-suave); 
            text-decoration: none; font-size: 13px; border-left: 3px solid transparent; 
            cursor: pointer; transition: 0.2s;
        }
        .cat-link:hover, .cat-link.active { background: rgba(229, 9, 20, 0.1); color: white; border-left-color: var(--destaque-principal); }
        .canal-card { background: var(--fundo-cartao); border-radius: 8px; padding: 15px; text-align: center; cursor: pointer; transition: 0.3s; }
        .canal-card:hover { transform: translateY(-5px); border: 1px solid var(--destaque-principal); box-shadow: 0 10px 20px rgba(229, 9, 20, 0.2); }
        .canal-card img { width: 100%; height: 80px; object-fit: contain; margin-bottom: 10px; }
        .canal-name { font-size: 11px; font-weight: 700; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .logo { padding: 25px; color: var(--destaque-principal); font-weight: 900; font-size: 20px; }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="logo">ANGOMOVIE</div>
    <div class="cat-link active" onclick="loadChannels('')">🏠 TODOS OS CANAIS</div>
    <div id="categories-list"></div>
</aside>

<main class="main">
    <div class="grid" id="channels-grid">
        <p>Carregando canais...</p>
    </div>
</main>

<script>
    // Agora usando os campos que a biblioteca @iptv/xtream-api padroniza
    async function loadCategories() {
        const res = await fetch('/api/proxy?action=get_live_categories');
        const data = await res.json();
        const list = document.getElementById('categories-list');
        data.forEach(cat => {
            const div = document.createElement('div');
            div.className = 'cat-link';
            // A biblioteca padroniza para category_name ou categoryName
            div.innerText = cat.category_name; 
            div.onclick = () => loadChannels(cat.category_id);
            list.appendChild(div);
        });
    }

    async function loadChannels(catId) {
        document.getElementById('channels-grid').innerHTML = '<p>Buscando...</p>';
        const url = `/api/proxy?action=get_live_streams${catId ? '&category_id='+catId : ''}`;
        const res = await fetch(url);
        const data = await res.json();
        const grid = document.getElementById('channels-grid');
        grid.innerHTML = '';
        
        data.slice(0, 100).forEach(ch => {
            grid.innerHTML += `
                <div class="canal-card" onclick="location.href='player.html?id=${ch.stream_id}&name=${encodeURIComponent(ch.name)}'">
                    <img src="${ch.stream_icon || 'https://via.placeholder.com/150x80?text=TV'}" onerror="this.src='https://via.placeholder.com/150x80?text=TV'">
                    <div class="canal-name">${ch.name}</div>
                </div>`;
        });
    }

    loadCategories();
    loadChannels('');
</script>
</body>
</html>
