<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AngoMovie | TV Ao Vivo HD</title>
    
    <!-- SEO & Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

    <style>
        :root {
            --fundo-principal: #050a18;
            --fundo-secundario: #0a101f;
            --fundo-cartao: #141826;
            --destaque-principal: #e50914;
            --texto-principal: #ffffff;
            --texto-suave: #b3b3b3;
            --fonte-principal: "Montserrat", sans-serif;
            --borda: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--fundo-principal);
            color: var(--texto-principal);
            font-family: var(--fonte-principal);
            margin: 0;
            display: flex;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Sidebar Fixa */
        .sidebar {
            width: 260px;
            background: var(--fundo-secundario);
            height: 100vh;
            position: fixed;
            left: 0; top: 0;
            border-right: 1px solid var(--borda);
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .sidebar-header {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid var(--borda);
        }

        .logo {
            color: var(--destaque-principal);
            font-weight: 900;
            font-size: 24px;
            text-decoration: none;
            letter-spacing: -1px;
        }

        .categories-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .cat-link {
            display: block;
            padding: 12px 25px;
            color: var(--texto-suave);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
            cursor: pointer;
            border-left: 3px solid transparent;
            text-transform: uppercase;
        }

        .cat-link:hover, .cat-link.active {
            background: rgba(229, 9, 20, 0.1);
            color: white;
            border-left-color: var(--destaque-principal);
        }

        /* Área de Conteúdo */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 40px;
        }

        header {
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h2 { font-size: 24px; font-weight: 700; margin: 0; text-transform: uppercase; }

        /* Grid de Canais */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--fundo-cartao);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--destaque-principal);
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.4);
        }

        .card img {
            width: 100%;
            height: 90px;
            object-fit: contain;
            margin-bottom: 12px;
            border-radius: 5px;
            background: #000;
        }

        .card p {
            font-size: 11px;
            font-weight: 700;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-transform: uppercase;
        }

        .status-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            color: var(--texto-suave);
            font-weight: 600;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--fundo-principal); }
        ::-webkit-scrollbar-thumb { background: var(--destaque-principal); border-radius: 10px; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; padding: 20px; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="/" class="logo">ANGOMOVIE</a>
        </div>
        <div class="categories-container" id="categories-list">
            <div class="cat-link active" onclick="resetGrid()">🏠 TODOS OS CANAIS</div>
            <!-- Categorias carregadas via API -->
        </div>
    </aside>

    <main class="main-content">
        <header>
            <h2 id="cat-title">Canais de TV</h2>
            <div style="font-size: 10px; opacity: 0.4; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;">Streaming Gratuito</div>
        </header>

        <div class="grid" id="channels-grid">
            <div class="status-msg">Iniciando conexão com o servidor...</div>
        </div>
    </main>

<script>
    const WORKER_URL = "https://api-angomovie.lucreciapaulo93.workers.dev";

    // Função para buscar categorias
    async function loadCategories() {
        try {
            const res = await fetch(`${WORKER_URL}/?action=get_live_categories`, {
                mode: 'cors',
                cache: 'no-cache'
            });
            const data = await res.json();
            
            if (!Array.isArray(data)) return;

            const list = document.getElementById('categories-list');
            data.forEach(cat => {
                const div = document.createElement('div');
                div.className = 'cat-link';
                div.innerText = cat.category_name; 
                div.onclick = () => {
                    document.querySelectorAll('.cat-link').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    document.getElementById('cat-title').innerText = cat.category_name;
                    loadChannels(cat.category_id);
                };
                list.appendChild(div);
            });
        } catch (e) {
            console.error("Erro ao carregar categorias:", e);
        }
    }

    // Função para buscar canais
    async function loadChannels(catId = '') {
        const grid = document.getElementById('channels-grid');
        grid.innerHTML = '<div class="status-msg">Sintonizando canais...</div>';
        
        try {
            const url = `${WORKER_URL}/?action=get_live_streams${catId ? '&category_id='+catId : ''}`;
            const res = await fetch(url, {
                mode: 'cors',
                cache: 'no-cache'
            });
            const data = await res.json();
            
            if (!Array.isArray(data)) {
                grid.innerHTML = '<div class="status-msg">❌ Erro na resposta do servidor.</div>';
                return;
            }

            grid.innerHTML = '';
            if (data.length === 0) {
                grid.innerHTML = '<div class="status-msg">Nenhum canal nesta categoria.</div>';
                return;
            }

            data.slice(0, 200).forEach(ch => {
                const img = ch.stream_icon ? ch.stream_icon : 'https://via.placeholder.com/150x90/141826/ffffff?text=TV';
                grid.innerHTML += `
                    <div class="card" onclick="location.href='player.html?id=${ch.stream_id}&name=${encodeURIComponent(ch.name)}'">
                        <img src="${img}" onerror="this.src='https://via.placeholder.com/150x90/141826/ffffff?text=TV'">
                        <p>${ch.name}</p>
                    </div>`;
            });
        } catch (e) {
            grid.innerHTML = '<div class="status-msg">❌ Falha ao carregar canais. Verifique sua conexão.</div>';
        }
    }

    function resetGrid() {
        document.querySelectorAll('.cat-link').forEach(el => el.classList.remove('active'));
        document.querySelector('.cat-link').classList.add('active');
        document.getElementById('cat-title').innerText = "Todos os Canais";
        loadChannels('');
    }

    // Início
    loadCategories();
    loadChannels();
</script>
</body>
</html>
