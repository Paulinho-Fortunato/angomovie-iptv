<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Ao Vivo | AngoMovie</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet" />
    <style>
        :root {
            --fundo-principal: #050a18;
            --fundo-secundario: #0a101f;
            --fundo-cartao: #141826;
            --destaque-principal: #e50914;
            --texto-principal: #ffffff;
            --texto-suave: #b3b3b3;
            --fonte-principal: "Montserrat", sans-serif;
        }

        body {
            background-color: var(--fundo-principal);
            color: var(--texto-principal);
            font-family: var(--fonte-principal);
            margin: 0; display: flex; overflow-x: hidden;
        }

        .sidebar {
            width: 260px; background: var(--fundo-secundario); height: 100vh;
            position: fixed; left: 0; top: 0; border-right: 1px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column; z-index: 100;
        }

        .sidebar-header { padding: 30px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { color: var(--destaque-principal); font-weight: 900; font-size: 24px; text-decoration: none; }

        .categories-container { flex: 1; overflow-y: auto; padding: 20px 0; }
        .cat-link {
            display: block; padding: 12px 25px; color: var(--texto-suave);
            text-decoration: none; font-size: 13px; font-weight: 600;
            transition: 0.2s; cursor: pointer; border-left: 3px solid transparent;
        }
        .cat-link:hover, .cat-link.active { background: rgba(229, 9, 20, 0.1); color: white; border-left-color: var(--destaque-principal); }

        .main-content { margin-left: 260px; flex: 1; padding: 40px; min-height: 100vh; }
        header { margin-bottom: 40px; display: flex; justify-content: space-between; align-items: center; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; }
        .card {
            background: var(--fundo-cartao); border-radius: 10px; padding: 20px;
            text-align: center; transition: 0.3s; cursor: pointer; border: 1px solid transparent;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--destaque-principal); box-shadow: 0 10px 30px rgba(229, 9, 20, 0.3); }
        .card img { width: 100%; height: 90px; object-fit: contain; margin-bottom: 15px; }
        .card p { font-size: 12px; font-weight: 700; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        @media (max-width: 768px) { .sidebar { display: none; } .main-content { margin-left: 0; padding: 20px; } }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header"><a href="/" class="logo">ANGOMOVIE</a></div>
        <div class="categories-container" id="categories-list">
            <div class="cat-link active" onclick="loadChannels('')">🏠 TODOS OS CANAIS</div>
        </div>
    </aside>

    <main class="main-content">
        <header><h2 id="cat-title">Canais de TV</h2></header>
        <div class="grid" id="channels-grid"> <p>Carregando canais...</p> </div>
    </main>

<script>
    const WORKER_URL = "https://api-angomovie.lucreciapaulo93.workers.dev";

    async function loadCategories() {
        try {
            const res = await fetch(`${WORKER_URL}?action=get_live_categories`);
            const data = await res.json();
            const list = document.getElementById('categories-list');
            data.forEach(cat => {
                const div = document.createElement('div');
                div.className = 'cat-link';
                div.innerText = cat.category_name; 
                div.onclick = () => {
                    document.querySelectorAll('.cat-link').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    document.getElementById('cat-title').innerText = cat.category_name;
                    loadChannels(cat.category_id);
                };
                list.appendChild(div);
            });
        } catch (e) { console.error("Erro categorias:", e); }
    }

    async function loadChannels(catId) {
        const grid = document.getElementById('channels-grid');
        grid.innerHTML = '<p>Buscando...</p>';
        try {
            const url = `${WORKER_URL}?action=get_live_streams${catId ? '&category_id='+catId : ''}`;
            const res = await fetch(url);
            const data = await res.json();
            grid.innerHTML = '';
            data.slice(0, 150).forEach(ch => {
                const img = ch.stream_icon || 'https://via.placeholder.com/150x90/141826/ffffff?text=TV';
                grid.innerHTML += `
                    <div class="card" onclick="location.href='player.html?id=${ch.stream_id}&name=${encodeURIComponent(ch.name)}'">
                        <img src="${img}" onerror="this.src='https://via.placeholder.com/150x90/141826/ffffff?text=TV'">
                        <p>${ch.name}</p>
                    </div>`;
            });
        } catch (e) { grid.innerHTML = '<p>Erro ao carregar canais.</p>'; }
    }

    loadCategories();
    loadChannels('');
</script>
</body>
</html>
