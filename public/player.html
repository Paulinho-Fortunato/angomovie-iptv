<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Player | AngoMovie</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; }
        html, body { 
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body { 
            background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff; 
            display: flex;
            flex-direction: column;
        }
        .nav { 
            padding: 15px 20px; 
            background: #050a18; 
            border-bottom: 1px solid #1f2937;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
            z-index: 10;
        }
        .back { 
            background: #e50914; 
            color: white; 
            text-decoration: none; 
            padding: 10px 20px; 
            border-radius: 5px; 
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
            white-space: nowrap;
        }
        .back:hover {
            background: #cc0710;
        }
        #title {
            color: #b3b3b3;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .container { 
            flex: 1;
            width: 100%;
            overflow: hidden;
            display: flex;
            position: relative;
        }
        .video-container {
            width: 100%;
            height: 100%;
        }
        .video-js { 
            width: 100% !important; 
            height: 100% !important; 
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
        }
        .spinner {
            border: 4px solid #1f2937;
            border-top: 4px solid #e50914;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(229, 9, 20, 0.9);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 90%;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div class="nav">
        <button class="back" onclick="goBack()">← VOLTAR</button>
        <span id="title"></span>
    </div>
    <div class="container">
        <div class="video-container">
            <video id="player" class="video-js vjs-big-play-centered" controls autoplay playsinline></video>
        </div>
        <div class="loading" id="loader" style="display: none;">
            <div class="spinner"></div>
        </div>
        <div class="error-message" id="error" style="display: none;"></div>
    </div>

    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/videojs-http-streaming@3.12.0/dist/videojs-http-streaming.min.js"></script>
    <script>
        // Performance optimization: Cache DOM elements
        const playerElement = document.getElementById('player');
        const titleElement = document.getElementById('title');
        const loaderElement = document.getElementById('loader');
        const errorElement = document.getElementById('error');

        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const streamId = urlParams.get('id');
        const streamName = urlParams.get('name') || 'Stream';

        // Decode and display title
        titleElement.textContent = decodeURIComponent(streamName);

        // Show loader
        loaderElement.style.display = 'block';

        // Initialize Video.js player
        const player = videojs('player', {
            controls: true,
            autoplay: true,
            preload: 'auto',
            fluid: true,
            responsive: true,
            playbackRates: [0.5, 1, 1.5, 2],
            controlBar: {
                children: [
                    'playToggle',
                    'currentTimeDisplay',
                    'timeDivider',
                    'durationDisplay',
                    'progressControl',
                    'volumePanel',
                    'settingsMenuButton',
                    'fullscreenToggle'
                ]
            }
        });

        // Construct stream URL - HTTPS REQUIRED for CORS compliance
        // Replace HTTP with HTTPS to fix mixed content errors
        const streamUrl = `https://nitidez.pro/live/Marcio/123456/${streamId}.m3u8`;

        // Set video source
        player.src({
            src: streamUrl,
            type: 'application/x-mpegURL'
        });

        // Event handlers for better UX
        player.on('play', function() {
            loaderElement.style.display = 'none';
            errorElement.style.display = 'none';
        });

        player.on('playing', function() {
            loaderElement.style.display = 'none';
            errorElement.style.display = 'none';
            console.log('[AngoMovie] Stream playing: ' + streamName);
        });

        player.on('waiting', function() {
            loaderElement.style.display = 'block';
        });

        player.on('canplay', function() {
            loaderElement.style.display = 'none';
        });

        player.on('error', function() {
            loaderElement.style.display = 'none';
            const errorCode = player.error();
            if (errorCode) {
                console.error('[AngoMovie] Player Error:', {
                    code: errorCode.code,
                    message: errorCode.message,
                    streamId: streamId,
                    url: streamUrl
                });
                
                errorElement.innerHTML = `
                    <strong>⚠️ Erro ao carregar o stream</strong><br>
                    <small>Código: ${errorCode.code}</small><br>
                    <small>${errorCode.message || 'Verifique sua conexão'}</small><br>
                    <button class="back" onclick="location.reload()" style="margin-top: 15px;">Tentar Novamente</button>
                `;
                errorElement.style.display = 'block';
            }
        });

        // Network error handling
        player.on('error', function() {
            if (player.error() && player.error().code === 2) {
                console.warn('[AngoMovie] Network error - checking stream availability');
            }
        });

        // Dispose on page unload to free resources
        window.addEventListener('beforeunload', function() {
            if (player) {
                player.dispose();
            }
        });

        // Back button functionality
        function goBack() {
            // Store scroll position before leaving
            sessionStorage.setItem('channels-scroll', window.scrollY);
            window.history.back();
        }

        // Fullscreen support
        document.addEventListener('fullscreenchange', function() {
            if (document.fullscreenElement) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = 'auto';
            }
        });

        // Console info
        console.log('[AngoMovie] Player initialized');
        console.log('[AngoMovie] Stream ID:', streamId);
        console.log('[AngoMovie] Stream URL:', streamUrl);
    </script>
</body>
</html>
