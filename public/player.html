<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <title>Player | AngoMovie</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #000; margin: 0; font-family: 'Montserrat', sans-serif; color: #fff; }
        .nav-player { background: #050a18; padding: 15px 25px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .btn-voltar { background: #e50914; color: white; text-decoration: none; padding: 8px 18px; border-radius: 4px; font-size: 12px; font-weight: 700; margin-right: 20px; }
        .video-wrapper { width: 100vw; height: calc(100vh - 65px); }
        .video-js { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>

    <nav class="nav-player">
        <a href="index.html" class="btn-voltar">← Voltar</a>
        <div id="nome-canal" style="font-size: 14px; font-weight: 700;">Carregando...</div>
    </nav>

    <div class="video-wrapper">
        <video id="p" class="video-js vjs-big-play-centered" controls autoplay preload="auto"></video>
    </div>

    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script>
        const WORKER_URL = "https://api-angomovie.lucreciapaulo93.workers.dev";
        const params = new URLSearchParams(window.location.search);
        const streamId = params.get('id');
        const canalNome = params.get('name') || 'Canal de TV';
        
        document.getElementById('nome-canal').innerText = canalNome;

        // IMPORTANTE: Passamos o stream_id para o Worker para ele fazer o proxy do vídeo
        const videoProxyUrl = `${WORKER_URL}?stream_id=${streamId}`;

        const player = videojs('p');
        player.src({
            src: videoProxyUrl,
            type: 'application/x-mpegURL'
        });
    </script>
</body>
</html>
