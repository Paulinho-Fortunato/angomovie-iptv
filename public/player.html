<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <title>AngoMovie | Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        body { background: #000; margin: 0; color: #fff; font-family: 'Montserrat', sans-serif; }
        .nav { background: #050a18; padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #1f2937; }
        .back { background: #e50914; color: #fff; text-decoration: none; padding: 8px 15px; border-radius: 4px; font-size: 12px; margin-right: 20px; font-weight: bold;}
        video { width: 100vw; height: calc(100vh - 65px); background: #000; }
        #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html" class="back">← VOLTAR</a>
        <span id="title">Carregando canal...</span>
    </div>
    
    <div id="loading">Sintonizando...</div>
    <video id="video" controls autoplay playsinline></video>

    <script>
        const WORKER = "https://api-angomovie.lucreciapaulo93.workers.dev";
        const params = new URLSearchParams(window.location.search);
        const streamId = params.get('id');
        document.getElementById('title').innerText = params.get('name') || 'TV';

        const videoUrl = `${WORKER}/?stream_id=${streamId}`;
        const video = document.getElementById('video');
        const loading = document.getElementById('loading');
        let isLoadingVisible = true;

        // Função para esconder o loading (com proteção para não chamar múltiplas vezes)
        function hideLoading() {
            if (isLoadingVisible) {
                loading.style.display = 'none';
                isLoadingVisible = false;
            }
        }

        // Timeout de segurança: se após 15 segundos não carregar, esconde o loading mesmo assim
        setTimeout(() => {
            hideLoading();
        }, 15000);

        if (Hls.isSupported()) {
            const hls = new Hls({
                enableWorker: true,
                lowLatencyMode: false,
                manifestLoadingMaxRetry: 5,
                levelLoadingMaxRetry: 5,
                manifestLoadingTimeOut: 10000,
                levelLoadingTimeOut: 10000
            });
            
            hls.loadSource(videoUrl);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                console.log('Manifest parseado, tentando reproduzir...');
                video.play().catch(e => console.error('Erro ao iniciar playback:', e));
            });
            
            hls.on(Hls.Events.FRAG_LOADED, () => {
                hideLoading();
            });
            
            video.addEventListener('playing', () => {
                hideLoading();
            });
            
            video.addEventListener('loadeddata', () => {
                hideLoading();
            });
            
            hls.on(Hls.Events.ERROR, (event, data) => {
                console.error('Erro HLS:', data);
                if (data.fatal) {
                    switch(data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            console.error('Erro de rede, tentando recuperar...');
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            console.error('Erro de mídia, tentando recuperar...');
                            hls.recoverMediaError();
                            break;
                        default:
                            hideLoading();
                            break;
                    }
                }
            });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoUrl;
            
            video.addEventListener('loadedmetadata', () => {
                video.play().catch(e => console.error('Erro ao iniciar playback:', e));
            });
            
            video.addEventListener('playing', () => {
                hideLoading();
            });
            
            video.addEventListener('loadeddata', () => {
                hideLoading();
            });
            
            // Fallback para Safari/iOS
            setTimeout(() => {
                hideLoading();
            }, 10000);
        }
        else {
            loading.innerText = '❌ Player não suportado neste navegador';
        }
    </script>
</body>
</html>
