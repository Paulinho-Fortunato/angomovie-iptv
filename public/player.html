<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player | AngoMovie</title>
    
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --fundo-principal: #050a18;
            --fundo-secundario: #0a101f;
            --destaque-principal: #e50914;
            --texto-principal: #ffffff;
        }

        body {
            background: #000;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            color: var(--texto-principal);
            overflow: hidden;
        }

        /* Top Bar */
        .nav-player {
            background: var(--fundo-principal);
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            height: 60px;
            box-sizing: border-box;
        }

        .btn-voltar {
            background: var(--destaque-principal);
            color: white;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-voltar:hover {
            background: #f40612;
            transform: scale(1.05);
        }

        .canal-titulo {
            font-size: 14px;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
        }

        /* Container do Video */
        .video-wrapper {
            width: 100vw;
            height: calc(100vh - 60px);
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .video-js {
            width: 100% !important;
            height: 100% !important;
        }

        /* Alerta de Mixed Content (HTTP em HTTPS) */
        #mixed-content-warning {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--fundo-secundario);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid var(--destaque-principal);
            z-index: 100;
            max-width: 80%;
        }

        #mixed-content-warning h2 { color: var(--destaque-principal); margin-top: 0; }
        #mixed-content-warning p { font-size: 14px; line-height: 1.6; color: #ccc; }
        
        .btn-externo {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #2ecc71;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav class="nav-player">
        <a href="index.html" class="btn-voltar">← Voltar</a>
        <div class="canal-titulo" id="nome-canal">Carregando...</div>
        <div style="width: 80px;"></div> <!-- Spacer para centralizar -->
    </nav>

    <div class="video-wrapper">
        <video id="p" class="video-js vjs-big-play-centered" controls autoplay preload="auto">
            <p class="vjs-no-js">Para ver este vídeo, habilite o JavaScript.</p>
        </video>

        <!-- Aviso de erro (aparece se o navegador bloquear o HTTP) -->
        <div id="mixed-content-warning">
            <h2>⚠️ Bloqueio de Segurança</h2>
            <p>O seu navegador bloqueou o sinal por ser um link antigo (HTTP).<br>
            Para assistir, clique no <b>cadeado</b> na barra de endereço e ative <b>"Conteúdo Inseguro"</b> ou use o botão abaixo:</p>
            <a href="#" id="link-direto" class="btn-externo">ABRIR NO PLAYER EXTERNO (VLC)</a>
        </div>
    </div>

    <!-- Video.js Scripts -->
    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>

    <script>
        // 1. Pegar dados da URL
        const params = new URLSearchParams(window.location.search);
        const streamId = params.get('id');
        const canalNome = params.get('name') || 'Canal de TV';
        
        document.getElementById('nome-canal').innerText = canalNome;

        // 2. Configurar os dados do servidor (Devem bater com o seu IPTV)
        const server = "http://nitidez.pro";
        const user = "Marcio";
        const pass = "123456";
        const videoUrl = `${server}/live/${user}/${pass}/${streamId}.m3u8`;

        // Configurar botão de link externo (VLC/MX Player)
        document.getElementById('link-direto').href = videoUrl;

        // 3. Inicializar o Player
        const player = videojs('p', {
            autoplay: true,
            controls: true,
            responsive: true,
            fluid: true
        });

        player.src({
            src: videoUrl,
            type: 'application/x-mpegURL'
        });

        // 4. Detecção de Erro de Rede (Mixed Content)
        player.on('error', function() {
            const error = player.error();
            if (error.code === 2) { // MEDIA_ERR_NETWORK
                document.getElementById('mixed-content-warning').style.display = 'block';
            }
        });

        // Tentar detectar se o vídeo não carregou após 5 segundos
        setTimeout(() => {
            if (player.readyState() === 0) {
                document.getElementById('mixed-content-warning').style.display = 'block';
            }
        }, 5000);

    </script>
</body>
</html>
