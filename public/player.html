<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player | AngoMovie</title>
    
    <!-- Usando CDN da Cloudflare (mais confiável e menos bloqueado) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.6.1/video-js.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --fundo: #050a18; --vermelho: #e50914; }
        body { background: #000; margin: 0; font-family: 'Montserrat', sans-serif; color: #fff; overflow: hidden; }
        .nav-player { background: var(--fundo); padding: 15px 25px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); height: 60px; box-sizing: border-box; }
        .btn-voltar { background: var(--vermelho); color: white; text-decoration: none; padding: 8px 18px; border-radius: 4px; font-size: 12px; font-weight: 700; margin-right: 20px; }
        .video-wrapper { width: 100vw; height: calc(100vh - 60px); background: #000; position: relative; }
        .video-js { width: 100% !important; height: 100% !important; }
        
        #status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 10; display: block; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: var(--vermelho); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <nav class="nav-player">
        <a href="index.html" class="btn-voltar">← Voltar</a>
        <div id="nome-canal" style="font-size: 14px; font-weight: 700;">Carregando...</div>
    </nav>

    <div class="video-wrapper">
        <div id="status">
            <div class="spinner"></div>
            <p id="status-text">Conectando ao sinal...</p>
        </div>
        <video id="p" class="video-js vjs-big-play-centered" playsinline></video>
    </div>

    <!-- Bibliotecas via Cloudflare CDN (mais seguras) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.6.1/video.min.js"></script>

    <script>
        const WORKER_URL = "https://api-angomovie.lucreciapaulo93.workers.dev";
        const params = new URLSearchParams(window.location.search);
        const streamId = params.get('id');
        const canalNome = params.get('name') || 'Canal de TV';
        document.getElementById('nome-canal').innerText = canalNome;

        const videoUrl = `${WORKER_URL}?stream_id=${streamId}`;
        const video = document.getElementById('p');

        // Inicializa Video.js SEM persistência de dados (evita o bloqueio de tracking)
        const player = videojs('p', {
            autoplay: true,
            controls: true,
            preload: 'auto',
            persistConfig: false, // DESATIVA o acesso ao storage do navegador
            html5: { vhs: { overrideNative: true } }
        });

        function hideStatus() { document.getElementById('status').style.display = 'none'; }
        function setStatus(msg) { document.getElementById('status-text').innerText = msg; }

        if (Hls.isSupported()) {
            const hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 90
            });
            
            hls.loadSource(videoUrl);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                hideStatus();
                player.play().catch(() => setStatus("Clique para iniciar o play"));
            });

            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    console.warn("Erro HLS fatal:", data.type);
                    hls.recoverMediaError();
                }
            });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoUrl;
            video.addEventListener('loadedmetadata', hideStatus);
        }

        // Se após 10 segundos não carregar, tenta forçar
        setTimeout(() => { if(video.paused) setStatus("Sinal fraco, aguarde ou tente outro canal."); }, 10000);
    </script>
</body>
</html>
