<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <title>Player | AngoMovie</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        body { background: #000; margin: 0; font-family: sans-serif; color: #fff; }
        .nav { padding: 15px; background: #050a18; border-bottom: 1px solid #1f2937; }
        .back { background: #e50914; color: white; text-decoration: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; }
        .container { height: calc(100vh - 70px); }
        .video-js { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html" class="back">VOLTAR</a>
        <span id="title" style="margin-left: 20px;"></span>
    </div>
    <div class="container">
        <video id="p" class="video-js vjs-big-play-centered" controls autoplay></video>
    </div>
    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const name = urlParams.get('name');
        document.getElementById('title').innerText = name;
        
        const videoUrl = `http://nitidez.pro/live/Marcio/123456/${id}.m3u8`;
        const player = videojs('p');
        player.src({ src: videoUrl, type: 'application/x-mpegURL' });
    </script>
</body>
</html>
